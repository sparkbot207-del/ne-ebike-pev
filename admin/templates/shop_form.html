{% extends "base.html" %}

{% block title %}{{ 'Edit' if shop else 'Add' }} Shop{% endblock %}

{% block content %}
<div class="page-header">
    <h2>{{ '✏️ Edit' if shop else '➕ Add' }} Shop</h2>
    <a href="/shops" class="btn btn-secondary">← Back to Shops</a>
</div>

<div class="card">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>Shop Name *</label>
                <input type="text" name="name" value="{{ shop.name if shop else '' }}" required>
            </div>
        </div>

        <div class="form-group">
            <label>Street Address *</label>
            <input type="text" name="address" value="{{ shop.address if shop else '' }}" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>City *</label>
                <input type="text" name="city" value="{{ shop.city if shop else '' }}" required>
            </div>
            <div class="form-group">
                <label>State *</label>
                <select name="state" required>
                    {% for code, name in states %}
                    <option value="{{ code }}" {% if shop and shop.state == code %}selected{% endif %}>{{ name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>ZIP Code *</label>
                <input type="text" name="zip" value="{{ shop.zip if shop else '' }}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="phone" value="{{ shop.phone if shop else '' }}" placeholder="207-555-1234">
            </div>
            <div class="form-group">
                <label>Website</label>
                <input type="url" name="website" value="{{ shop.website if shop else '' }}" placeholder="https://...">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Services (comma-separated)</label>
                <input type="text" name="services" value="{{ shop.services|join(', ') if shop else '' }}" placeholder="sales, repairs, rentals">
            </div>
            <div class="form-group">
                <label>Brands (comma-separated)</label>
                <input type="text" name="brands" value="{{ shop.brands|join(', ') if shop else '' }}" placeholder="Trek, Specialized, Rad">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-check">
                    <input type="checkbox" name="featured" {% if shop and shop.featured %}checked{% endif %}>
                    Featured Shop (shown prominently)
                </label>
            </div>
            {% if shop %}
            <div class="form-group">
                <label class="form-check">
                    <input type="checkbox" name="active" {% if shop.active %}checked{% endif %}>
                    Active (visible on site)
                </label>
            </div>
            {% endif %}
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ '💾 Save Changes' if shop else '➕ Add Shop' }}</button>
            <a href="/shops" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
